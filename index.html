<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .tab-bar {
            z-index: 1;
            background: white;
            position: sticky;
            top: 0;
            padding: 0 10px;
        }

        .tab-button {
            flex: 1;
            padding: 16px;
            border: none;

            background: none;
            font-size: 15px;
            cursor: pointer;
        }

        .tab-button.active {
            color: white;
            font-size: 15px;
            padding: 5px 10px;
            background-color: #18429F;
            border-radius: 50px;
            /* border-bottom: 2px solid #18429F; */
            font-weight: bold;
        }

        .slider-wrapper {
            overflow: hidden;
            width: 100%;
        }

        .slider {
            display: flex;
            width: 400%;
            transition: transform 0.3s ease;
        }

        .tab-content {
            width: 100vw;
            flex-shrink: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        .tab-content iframe {
            width: 100%;
            height: calc(100vh - 72px);
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

    <div class="tab-bar">
        <button class="tab-button active" data-tab="1">회장인사말</button>
        <button class="tab-button" data-tab="2">연혁</button>
        <button class="tab-button" data-tab="3">조직도</button>
        <button class="tab-button" data-tab="4">역대회장</button>
    </div>

    <div class="slider-wrapper">
        <div class="slider" id="slider">
            <div id="tab-1" class="tab-content"></div>
            <div id="tab-2" class="tab-content"></div>
            <div id="tab-3" class="tab-content"></div>
            <div id="tab-4" class="tab-content"></div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.tab-button');
        const contents = document.querySelectorAll('.tab-content');
        const slider = document.getElementById('slider');

        let currentTab = 0;
        let startX = 0;
        let endX = 0;
        let currentTranslate = 0;
        let isDragging = false;
        let isZoomed = false;

        function loadPage(id, file) {
            const container = document.getElementById(id);

            const iframe = document.createElement('iframe');
            iframe.src = file;
            iframe.style.width = '100%';
            iframe.style.border = '0';
            iframe.style.height = `calc(100vh - ${document.querySelector('.tab-bar').offsetHeight}px)`;

            container.innerHTML = '';
            container.appendChild(iframe);

            iframe.onload = () => {
                try {
                    const iframeWindow = iframe.contentWindow;
                    const iframeDocument = iframeWindow.document;

                    bindSwipe(iframeDocument, iframeWindow);
                } catch (e) {
                    console.log(e);
                }
            };
        }

        function bindSwipe(target, iframeWindow = window) {
            target.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;

                const scale = iframeWindow.visualViewport?.scale || 1;
                isZoomed = scale > 1;

                if (isZoomed) return;

                isDragging = true;
                startX = e.touches[0].clientX;

                slider.style.transition = 'none';
            }, { passive: true });

            target.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                if (e.touches.length !== 1) return;

                const scale = iframeWindow.visualViewport?.scale || 1;
                if (scale > 1) {
                    isDragging = false;
                    return;
                }

                const currentX = e.touches[0].clientX;
                const diff = currentX - startX;

                currentTranslate = (-currentTab * window.innerWidth) + diff;

                const maxTranslate = 0;
                const minTranslate = -((buttons.length - 1) * window.innerWidth);

                if (currentTranslate > maxTranslate) {
                    currentTranslate = maxTranslate + (currentTranslate - maxTranslate) * 0.25;
                }

                if (currentTranslate < minTranslate) {
                    currentTranslate = minTranslate + (currentTranslate - minTranslate) * 0.25;
                }

                slider.style.transform = `translateX(${currentTranslate}px)`;
            }, { passive: true });

            target.addEventListener('touchend', (e) => {
                if (!isDragging) return;

                const scale = iframeWindow.visualViewport?.scale || 1;
                if (scale > 1 || isZoomed) {
                    isDragging = false;
                    isZoomed = false;
                    return;
                }

                isDragging = false;

                const currentScale = iframeWindow.visualViewport?.scale || 1;
                if (currentScale === 1) {
                    startX = e.changedTouches[0].clientX;
                }

                endX = e.changedTouches[0].clientX;

                const diff = startX - endX;

                slider.style.transition = 'transform 0.3s ease';

                if (Math.abs(diff) > 80) {
                    if (diff > 0 && currentTab < buttons.length - 1) {
                        changeTab(currentTab + 1);
                    } else if (diff < 0 && currentTab > 0) {
                        changeTab(currentTab - 1);
                    } else {
                        changeTab(currentTab);
                    }
                } else {
                    changeTab(currentTab);
                }
            }, { passive: true });
        }

        bindSwipe(document);

        loadPage('tab-1', './intro1/1.html');
        loadPage('tab-2', './intro2/2.html');
        loadPage('tab-3', './intro3/3.html');
        loadPage('tab-4', './intro4/4.html');

            
        function changeTab(index) {
            if (index < 0 || index >= buttons.length) return;

            buttons.forEach(b => b.classList.remove('active'));
            buttons[index].classList.add('active');

            currentTranslate = -index * window.innerWidth;
            slider.style.transform = `translateX(${currentTranslate}px)`;

            currentTab = index;
        }

        buttons.forEach((button, index) => {
            button.addEventListener('click', () => {
                changeTab(index);
            });
        });

    </script>

</body>

</html>
