<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      text-align: center;
      padding: 0 20px;
    }

    .ceo-img img {
      width: 35%;
      height: 35%;
    }

    .ceo-con-wrap p {
      font-weight: 600;
      color: #2A388D;
      text-align: center;
      padding-bottom: 12px;
    }

    .ceo-contents img {
      width: 100%;
    }
        /* 이미지 팝업 */
        .image-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content-wrap {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-image {
      width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 24px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10000;
    }

  </style>
</head>

<body>
  <main class="sub-area">
    <br><br>
    <section class="sub-ceo-wrap layout-wrap">
      <div class="ceo-img-contents-wrap">
        <div class="ceo-img-wrap">
          <div class="ceo-img">
            <img src="./img/chairman-532026.png" alt="회장">
          </div>
        </div>
        <div class="ceo-con-wrap">
          <p>포철공고 포스코 동문회<br>
            제 53대 회장 오재식(21회)
          </p>

        </div>
      </div>
    </section>
    <div class="ceo-contents layout-wrap">
      <img src="./img/greetings_53_4.png" alt="회장">
    </div>

  </main>
  <div id="imageModal" class="image-modal">
    <span class="close-btn">&times;</span>
    <div class="modal-content-wrap">
      <img id="modalImage" class="modal-image" src="" alt="">
    </div>
  </div>
  <script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    const closeBtn = document.querySelector(".close-btn");

    // 모든 조직도 이미지 선택
    const images = document.querySelectorAll("img");

    images.forEach((img) => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
        modalImg.alt = img.alt;
      });
    });

    // 닫기 버튼
    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });

    // 배경 클릭 시 닫기
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    });
  </script>
</body>

</html>
